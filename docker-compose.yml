services:
  gigascribe:
    build: .
    image: gigascribe:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GIGASCRIBE_DATA_DIR: /opt/gigascribe/data
      GIGASCRIBE_MODELS_DIR: /opt/gigascribe/models
      HF_HOME: /opt/gigascribe/models/huggingface
      TORCH_HOME: /opt/gigascribe/models/torch
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./data:/opt/gigascribe/data
      - ./models:/opt/gigascribe/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # CPU работает по умолчанию.
    # Для NVIDIA GPU установите NVIDIA Container Toolkit и раскомментируйте блок ниже.
    # gpus: all
    # environment:
    #   NVIDIA_VISIBLE_DEVICES: all
    #   NVIDIA_DRIVER_CAPABILITIES: compute,utility
