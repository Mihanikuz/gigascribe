x-environment: &environment
  GIGASCRIBE_DATA_DIR: /opt/gigascribe/data
  GIGASCRIBE_MODELS_DIR: /opt/gigascribe/models
  GIGASCRIBE_DEVICE: cuda
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  HF_HOME: /opt/gigascribe/models/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYANNOTE_METRICS_ENABLED: "0"
  TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
  XDG_CACHE_HOME: /opt/gigascribe/data/cache
  MPLCONFIGDIR: /opt/gigascribe/data/cache/matplotlib

services:
  gigascribe-gpu:
    env_file: [.env]
    image: gigascribe:gpu-local
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        TORCH_REQUIREMENTS: requirements-cu128.txt
        # No proxy is configured here -- these three only forward whatever
        # http_proxy/https_proxy/no_proxy you already have set in your own
        # shell (empty/unset by default, so this is a no-op for everyone
        # who doesn't need a proxy). See README "Restricted networks" for
        # why `docker compose build` alone does NOT pick these up from the
        # shell without this passthrough.
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    ports: ["8000:8000"]
    environment: *environment
    volumes:
      - ./data:/opt/gigascribe/data
      - ./models:/opt/gigascribe/models
    gpus: all
    restart: unless-stopped
