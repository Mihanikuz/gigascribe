name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi uvicorn python-multipart passlib[bcrypt] itsdangerous requests gradio==5.38.2 xmlschema
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compile
        run: python -m compileall app.py server.py model_store.py scripts tests protocol
      - name: Pytest
        run: pytest -q
      - name: Prepare .env for compose
        run: cp .env.example .env
      - name: Docker compose config
        run: docker compose config
      - name: Build Docker image
        run: docker compose build
      - name: Container import smoke
        # Plain `docker run`, not `docker compose run`: the compose service
        # declares `gpus: all`, which this hosted runner (no GPU) can't
        # satisfy. These steps already override --entrypoint, so they never
        # exercised GPU behavior anyway -- just imports and permissions.
        run: docker run --rm --entrypoint python gigascribe:gpu-local -c "import gradio, requests, torch, torchaudio; import app; import server"
      - name: Confirm default image excludes llama-cpp-python (item 23)
        # This build used INSTALL_PROTOCOL=0 (the default) -- llama_cpp must
        # not be importable, proving the protocol module's heavy optional
        # dependency never lands in the image unless explicitly requested.
        # A real INSTALL_PROTOCOL=1 CUDA build isn't run here: it needs an
        # actual CUDA build toolchain this hosted runner doesn't have.
        run: |
          if docker run --rm --entrypoint python gigascribe:gpu-local -c "import llama_cpp" 2>/dev/null; then
            echo "llama_cpp must NOT be importable in the default (INSTALL_PROTOCOL=0) image" >&2
            exit 1
          fi
      - name: Volume permission smoke
        run: |
          mkdir -p data models
          docker run --rm --entrypoint sh -v "$PWD/data:/opt/gigascribe/data" -v "$PWD/models:/opt/gigascribe/models" gigascribe:gpu-local -c 'touch /opt/gigascribe/data/users.json /opt/gigascribe/models/.write-test'
